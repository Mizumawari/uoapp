<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroLoom</title>
<style>
:root{
  --bg:#14161a;--panel:#1c1f25;--panel2:#242830;--line:#323743;--text:#e6e8ec;--dim:#9299a6;
  --accent:#e0a044;--accent-ink:#1a1408;--ok:#58c98b;--warn:#e9b44c;--bad:#ef6b6b;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f3f1ec;--panel:#fff;--panel2:#f7f5f0;--line:#dcd8cf;--text:#22252b;--dim:#6c7280;
    --accent:#b8741a;--accent-ink:#fff;--ok:#1f9d5c;--warn:#a8750c;--bad:#c93c3c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Yu Gothic UI","Meiryo",sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;letter-spacing:.04em}
.logo span{color:var(--accent)}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:var(--ok)}
.pill.off{color:var(--warn);border-color:var(--warn)}
.fg{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
.sp{flex:1}
.save{font-size:12px;color:var(--dim);min-width:5em;text-align:right}
.save.err{color:var(--bad)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--dim);padding:4px 7px}
.btn.ghost:hover{color:var(--text);border-color:var(--line)}
.btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px}
aside h3{margin:0 8px 8px;font-size:11px;color:var(--dim);letter-spacing:.1em}
.prof{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.prof:hover{background:var(--panel2)}
.prof.sel{background:var(--panel2);border-color:var(--line)}
.prof .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 6px var(--ok)}
main{padding:20px 24px 80px;max-width:980px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
input[type=text],input[type=number],select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--text)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:84px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-top:14px}
.card.running{border-color:var(--ok)}
.card .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.card .hd input.name{flex:1;min-width:160px;font-weight:600;background:none;border-color:transparent}
.card .hd input.name:hover,.card .hd input.name:focus{background:var(--panel2);border-color:var(--line)}
.steps{border-top:1px solid var(--line);padding:8px 14px 12px}
.step{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.step .no{width:20px;color:var(--dim);font-size:12px;text-align:right;flex:none}
.kbd{font-family:Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:4px 10px;cursor:pointer;min-width:80px;text-align:center}
.kbd.empty{color:var(--dim);font-family:inherit}
.kbd:hover{border-color:var(--accent)}
.sw{position:relative;width:36px;height:20px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:.15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{left:18px}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:1px}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add .btn{font-size:12px;padding:3px 10px}
.hint{color:var(--dim);font-size:12px}
.chk{display:flex;align-items:center;gap:4px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 34px;text-align:center;max-width:420px}
.modal h2{margin:0 0 6px;font-size:18px}
.modal .big{font-family:Consolas,monospace;font-size:22px;margin:16px 0;color:var(--accent);min-height:1.5em}
input[type=color]{width:38px;height:30px;padding:2px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;cursor:pointer}
.sub{display:flex;align-items:center;gap:8px;padding:0 14px 10px 60px;flex-wrap:wrap}
.logstat{font-size:12px;color:var(--dim);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logstat.ok b{color:var(--ok)}.logstat.ng b{color:var(--bad)}
.step.cond{background:var(--panel2);border-radius:7px;padding:5px 6px;margin:2px -6px}
.diag{padding:6px 18px;font-size:12px;color:var(--dim);background:var(--panel2);border-bottom:1px solid var(--line)}
.diag b{color:var(--text)}.diag .ok{color:var(--ok)}.diag .ng{color:var(--bad)}
.empty-state{color:var(--dim);padding:40px 0;text-align:center}
@media (max-width:720px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="logo">Macro<span>Loom</span> <small id="ver" style="font-weight:400;font-size:11px;color:var(--dim)"></small></div>
  <span id="pill" class="pill on">動作中</span>
  <span id="fg" class="fg"></span>
  <span class="sp"></span>
  <span id="save" class="save"></span>
  <label class="row" style="gap:6px"><span class="hint">一時停止キー</span><button id="pauseKey" class="kbd"></button></label>
  <button id="pauseBtn" class="btn">一時停止</button>
  <button id="quitBtn" class="btn ghost danger" title="MacroLoomを終了">終了</button>
</header>
<div id="diag" class="diag"></div>
<div class="wrap">
  <aside>
    <h3>プロファイル</h3>
    <div id="profiles"></div>
    <button id="addProf" class="btn" style="margin:10px 8px 0">＋ プロファイル追加</button>
  </aside>
  <main id="main"></main>
</div>
<script>
const TOKEN = "__TOKEN__";
let cfg = null, sel = null, st = {active: [], running: [], paused: false, logs: {}, diag: {}};
function isLive(id) { const f = (st.diag.fired || {})[id]; return st.running.includes(id) || (f != null && f < 2500); }

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  if (r.status === 403) { // MacroLoom was restarted: this tab holds a stale key
    if (!sessionStorageFlag()) location.reload();
    throw new Error("再接続が必要です。このページを再読み込みしてください");
  }
  if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
  return r.json();
}
function sessionStorageFlag() { // reload at most once per 5s to avoid loops
  try { const k = "ml-reload", t = +sessionStorage.getItem(k) || 0; if (Date.now() - t < 5000) return true; sessionStorage.setItem(k, Date.now()); } catch (e) {}
  return false;
}
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
  return e;
}
const uid = () => Math.random().toString(36).slice(2, 10);

// ----- saving -----
let saveTimer = null;
const saveEl = document.getElementById("save");
function changed() {
  saveEl.className = "save"; saveEl.textContent = "保存中…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await api("PUT", "/api/config", cfg); saveEl.textContent = "保存済み"; }
    catch (e) { saveEl.className = "save err"; saveEl.textContent = e.message; }
  }, 350);
}

// ----- key capture -----
const CODE_ALIAS = {ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right"};
const MOD_CODES = /^(Control|Shift|Alt|Meta|OS)(Left|Right)?$/;
function codeName(code) {
  if (/^Key[A-Z]$/.test(code)) return code.slice(3);
  if (/^Digit\d$/.test(code)) return code.slice(5);
  return CODE_ALIAS[code] || code;
}
const KNOWN = new Set(("Enter NumpadEnter Escape Space Tab Backspace Insert Delete Home End PageUp PageDown Up Down Left Right " +
  "NumpadMultiply NumpadAdd NumpadSubtract NumpadDecimal NumpadDivide Pause ScrollLock CapsLock PrintScreen " +
  "Minus Equal BracketLeft BracketRight Backslash Semicolon Quote Backquote Comma Period Slash IntlRo IntlYen").split(" "));
function known(n) { return KNOWN.has(n) || /^[A-Z0-9]$/.test(n) || /^F([1-9]|1\d|2[0-4])$/.test(n) || /^Numpad\d$/.test(n); }
function modPrefix(e) { return (e.ctrlKey ? "Ctrl+" : "") + (e.shiftKey ? "Shift+" : "") + (e.altKey ? "Alt+" : ""); }

function capture(allowMouse) {
  return new Promise(resolve => {
    const big = h("div", {class: "big"}, "…");
    const box = h("div", {class: "modal"},
      h("h2", {}, "キーを押してください"),
      h("div", {class: "hint"}, allowMouse ? "Ctrl / Shift / Alt との組み合わせ、マウスの中ボタン・サイドボタン・ホイールも使えます" : "Ctrl / Shift / Alt との組み合わせも使えます"),
      big,
      h("div", {class: "row", style: "justify-content:center"},
        h("button", {class: "btn", onclick: () => done(undefined)}, "キャンセル"),
        h("button", {class: "btn danger", onclick: () => done("")}, "割り当て解除")));
    const ov = h("div", {class: "overlay"}, box);
    function done(v) {
      window.removeEventListener("keydown", onKey, true);
      window.removeEventListener("keyup", stop, true);
      ov.remove(); resolve(v);
    }
    function stop(e) { e.preventDefault(); e.stopPropagation(); }
    function onKey(e) {
      stop(e);
      if (MOD_CODES.test(e.code)) { big.textContent = modPrefix(e) + "…"; return; }
      const n = codeName(e.code);
      if (!known(n)) { big.textContent = "このキーは使えません"; return; }
      done(modPrefix(e) + n);
    }
    window.addEventListener("keydown", onKey, true);
    window.addEventListener("keyup", stop, true);
    if (allowMouse) {
      ov.addEventListener("mousedown", e => {
        const m = {1: "MButton", 3: "XButton1", 4: "XButton2"}[e.button];
        if (m) { e.preventDefault(); done(modPrefix(e) + m); }
      });
      ov.addEventListener("mouseup", e => { if (e.button) e.preventDefault(); });
      ov.addEventListener("auxclick", e => e.preventDefault());
      ov.addEventListener("wheel", e => { e.preventDefault(); done(modPrefix(e) + (e.deltaY < 0 ? "WheelUp" : "WheelDown")); }, {passive: false});
    }
    document.body.append(ov);
    if (document.activeElement) document.activeElement.blur();
  });
}
function keyBtn(get, set, allowMouse, emptyLabel) {
  const b = h("button", {class: "kbd"});
  const paint = () => { const v = get(); b.textContent = v || emptyLabel || "未設定"; b.classList.toggle("empty", !v); };
  b.addEventListener("click", async () => {
    const v = await capture(allowMouse);
    if (v === undefined) return;
    set(v); paint(); changed();
  });
  paint();
  return b;
}
function toggle(get, set, title) {
  const i = h("input", {type: "checkbox", title});
  i.checked = get();
  i.addEventListener("change", () => { set(i.checked); changed(); renderProfiles(); });
  return h("span", {class: "sw"}, i, h("i"));
}
function textIn(get, set, attrs) {
  const i = h("input", Object.assign({type: "text"}, attrs));
  i.value = get() || "";
  i.addEventListener("input", () => { set(i.value); changed(); });
  return i;
}
function numIn(get, set, attrs) {
  const i = h("input", Object.assign({type: "number"}, attrs));
  i.value = get() || 0;
  i.addEventListener("input", () => { set(parseInt(i.value, 10) || 0); changed(); });
  return i;
}
function selIn(get, set, opts) {
  const s = h("select", {}, opts.map(([v, t]) => h("option", {value: v}, t)));
  s.value = get();
  s.addEventListener("change", () => { set(s.value); changed(); render(); });
  return s;
}
async function countdown(btn, fn) {
  const label = btn.textContent; btn.disabled = true;
  let n = 3; btn.textContent = n + "…";
  const t = setInterval(() => { n--; if (n > 0) btn.textContent = n + "…"; }, 1000);
  try { return await fn(); }
  catch (e) { alertMsg(e.message); }
  finally { clearInterval(t); btn.textContent = label; btn.disabled = false; }
}
function alertMsg(msg) { saveEl.className = "save err"; saveEl.textContent = msg; }

// ----- rendering -----
function renderProfiles() {
  const box = document.getElementById("profiles");
  box.replaceChildren(...cfg.profiles.map(p => {
    const live = p.enabled && st.active.includes(p.id) && !st.paused;
    return h("div", {class: "prof" + (p.id === sel ? " sel" : ""), onclick: () => { sel = p.id; render(); }},
      h("span", {class: "dot" + (live ? " live" : ""), title: live ? "いま有効" : ""}),
      h("span", {class: "nm"}, p.name || "(名前なし)"));
  }));
}

const STEP_TYPES = [["key", "キーを押す"], ["text", "文字を入力"], ["wait", "待つ"], ["click", "マウス"], ["down", "キーを押し続ける"], ["up", "キーを離す"],
  ["ifpixel", "画面の色が条件に合うときだけ続ける"], ["waitpixel", "画面の色が変わるまで待つ"], ["waitlog", "ログに文字が出るまで待つ"]];
const STEP_SHORT = {ifpixel: "条件: 画面の色", waitpixel: "待つ: 画面の色", waitlog: "待つ: ログ"};
function newStep(t) {
  return {key: {type: "key", keys: ""}, down: {type: "down", keys: ""}, up: {type: "up", keys: ""},
    text: {type: "text", text: "", enter: true}, wait: {type: "wait", ms: 500, jitter: 0},
    click: {type: "click", button: "left", pos: "cursor", x: 0, y: 0},
    ifpixel: {type: "ifpixel", pos: "window", x: 0, y: 0, color: "#ff0000", tol: 24, not: false},
    waitpixel: {type: "waitpixel", pos: "window", x: 0, y: 0, color: "#ff0000", tol: 24, not: false, timeout: 10000},
    waitlog: {type: "waitlog", text: "", timeout: 10000}}[t];
}
function stepRow(m, s, i) {
  const move = d => { const j = i + d; if (j < 0 || j >= m.steps.length) return; [m.steps[i], m.steps[j]] = [m.steps[j], m.steps[i]]; changed(); render(); };
  let body;
  const label = Object.fromEntries(STEP_TYPES)[s.type];
  if (s.type === "key" || s.type === "down" || s.type === "up") {
    body = [h("span", {}, label), keyBtn(() => s.keys, v => s.keys = v, false, "キーを選ぶ")];
  } else if (s.type === "text") {
    const c = h("input", {type: "checkbox"}); c.checked = !!s.enter;
    c.addEventListener("change", () => { s.enter = c.checked; changed(); });
    body = [h("span", {}, label), textIn(() => s.text, v => s.text = v, {placeholder: "入力する文字", style: "flex:1;min-width:180px"}),
      h("label", {class: "chk"}, c, "最後に Enter")];
  } else if (s.type === "wait") {
    body = [h("span", {}, label), numIn(() => s.ms, v => s.ms = v, {min: 0, step: 50}), h("span", {class: "hint"}, "ミリ秒　＋ランダム 0〜"),
      numIn(() => s.jitter, v => s.jitter = v, {min: 0, step: 50}), h("span", {class: "hint"}, "ミリ秒")];
  } else if (s.type === "ifpixel" || s.type === "waitpixel") {
    const col = h("input", {type: "color", title: "判定する色"}); col.value = s.color || "#ff0000";
    col.addEventListener("input", () => { s.color = col.value; changed(); });
    const pick = h("button", {class: "btn", title: "押してから3秒以内に、ゲーム画面の見たい場所(HPバーなど)へカーソルを置いてください。位置と色を両方取り込みます"}, "位置と色を取得");
    pick.addEventListener("click", async () => {
      const r = await countdown(pick, () => api("POST", "/api/pick"));
      if (!r) return;
      if (s.pos === "screen") { s.x = r.x; s.y = r.y; } else { s.x = r.wx; s.y = r.wy; }
      if (r.color) s.color = r.color;
      changed(); render();
    });
    body = [h("span", {}, STEP_SHORT[s.type]),
      selIn(() => s.pos === "screen" ? "screen" : "window", v => s.pos = v, [["window", "ウィンドウ内"], ["screen", "画面"]]),
      h("span", {class: "hint"}, "X"), numIn(() => s.x, v => s.x = v), h("span", {class: "hint"}, "Y"), numIn(() => s.y, v => s.y = v),
      h("span", {class: "hint"}, "が"), col,
      selIn(() => s.not ? "1" : "0", v => s.not = v === "1", s.type === "ifpixel" ? [["0", "のときだけ続ける"], ["1", "でないときだけ続ける"]] : [["0", "になるまで待つ"], ["1", "でなくなるまで待つ"]]),
      pick,
      h("span", {class: "hint"}, "色の許容差"), numIn(() => s.tol, v => s.tol = v, {min: 0, max: 255, style: "width:64px"})];
    if (s.type === "waitpixel") body.push(h("span", {class: "hint"}, "最大"), numIn(() => s.timeout, v => s.timeout = v, {min: 0, step: 500}), h("span", {class: "hint"}, "ミリ秒（0=無制限）"));
  } else if (s.type === "waitlog") {
    body = [h("span", {}, STEP_SHORT[s.type]), textIn(() => s.text, v => s.text = v, {placeholder: "ログに出る文字の一部", style: "flex:1;min-width:180px"}),
      h("span", {class: "hint"}, "最大"), numIn(() => s.timeout, v => s.timeout = v, {min: 0, step: 500}), h("span", {class: "hint"}, "ミリ秒（0=無制限）")];
  } else {
    const c = h("input", {type: "checkbox"}); c.checked = !!s.double;
    c.addEventListener("change", () => { s.double = c.checked; changed(); });
    body = [h("span", {}, label),
      selIn(() => s.button || "left", v => s.button = v, [["left", "左クリック"], ["right", "右クリック"], ["middle", "中クリック"], ["none", "移動のみ"]]),
      s.button !== "none" && h("label", {class: "chk"}, c, "ダブル"),
      selIn(() => s.pos || "cursor", v => s.pos = v, [["cursor", "今のカーソル位置"], ["window", "ウィンドウ内の座標"], ["screen", "画面の座標"]])];
    if (s.pos === "window" || s.pos === "screen") {
      const pick = h("button", {class: "btn", title: "押してから3秒以内に、ゲーム画面の目的の場所へカーソルを置いてください"}, "位置を取得");
      pick.addEventListener("click", async () => {
        const r = await countdown(pick, () => api("POST", "/api/pick"));
        if (!r) return;
        if (s.pos === "window") { s.x = r.wx; s.y = r.wy; } else { s.x = r.x; s.y = r.y; }
        changed(); render();
      });
      body.push(h("span", {class: "hint"}, "X"), numIn(() => s.x, v => s.x = v), h("span", {class: "hint"}, "Y"), numIn(() => s.y, v => s.y = v), pick);
    }
  }
  return h("div", {class: "step" + (STEP_SHORT[s.type] ? " cond" : "")}, h("span", {class: "no"}, i + 1), ...body, h("span", {class: "sp"}),
    h("button", {class: "btn ghost", title: "上へ", onclick: () => move(-1)}, "↑"),
    h("button", {class: "btn ghost", title: "下へ", onclick: () => move(1)}, "↓"),
    h("button", {class: "btn ghost danger", title: "この手順を削除", onclick: () => { m.steps.splice(i, 1); changed(); render(); }}, "✕"));
}
function macroCard(p, m) {
  const test = h("button", {class: "btn", title: "押してから3秒後に、前面のウィンドウで1回実行します"}, "テスト");
  test.addEventListener("click", async () => {
    clearTimeout(saveTimer);
    try { await api("PUT", "/api/config", cfg); saveEl.className = "save"; saveEl.textContent = "保存済み"; } catch (e) { alertMsg(e.message); return; }
    countdown(test, () => api("POST", "/api/test", {id: m.id}));
  });
  return h("div", {class: "card" + (isLive(m.id) ? " running" : ""), "data-id": m.id},
    h("div", {class: "hd"},
      toggle(() => m.enabled, v => m.enabled = v, "このマクロを有効にする"),
      textIn(() => m.name, v => m.name = v, {class: "name", placeholder: "マクロ名"}),
      keyBtn(() => m.trigger, v => m.trigger = v, true, "起動キー"),
      selIn(() => m.mode, v => m.mode = v, [["once", "1回実行"], ["hold", "押している間くり返す"], ["toggle", "押すたびに開始/停止"]]),
      test,
      h("button", {class: "btn ghost", title: "複製", onclick: () => {
        const c = JSON.parse(JSON.stringify(m)); c.id = uid(); c.name += " のコピー"; c.trigger = "";
        p.macros.splice(p.macros.indexOf(m) + 1, 0, c); changed(); render(); }}, "複製"),
      h("button", {class: "btn ghost danger", title: "マクロを削除", onclick: () => {
        if (confirm("「" + (m.name || "このマクロ") + "」を削除しますか？")) { p.macros.splice(p.macros.indexOf(m), 1); changed(); render(); } }}, "削除")),
    h("div", {class: "sub"},
      h("span", {class: "hint"}, "ログ起動:"),
      textIn(() => m.logTrigger, v => m.logTrigger = v, {placeholder: p.logPath ? "ログにこの文字が出たら1回実行（空欄=使わない）" : "プロファイルにログファイルを設定すると使えます", style: "flex:1;min-width:220px"})),
    h("div", {class: "steps"},
      m.steps.length ? m.steps.map((s, i) => stepRow(m, s, i)) : h("div", {class: "hint"}, "手順がありません。下のボタンで追加してください。"),
      h("div", {class: "add"}, STEP_TYPES.map(([t, l]) =>
        h("button", {class: "btn", onclick: () => { m.steps.push(newStep(t)); changed(); render(); }}, "＋ " + l)))));
}
function render() {
  renderProfiles();
  const main = document.getElementById("main");
  const p = cfg.profiles.find(x => x.id === sel);
  if (!p) { main.replaceChildren(h("div", {class: "empty-state"}, "左の「＋ プロファイル追加」から始めてください。")); return; }
  const pick = h("button", {class: "btn", title: "押してから3秒以内に、対象のゲームウィンドウをクリックして前面にしてください"}, "ウィンドウから取得");
  pick.addEventListener("click", async () => {
    const r = await countdown(pick, () => api("POST", "/api/pick"));
    if (r && r.exe) { p.match = r.exe; changed(); render(); }
  });
  main.replaceChildren(
    h("div", {class: "row"},
      toggle(() => p.enabled, v => p.enabled = v, "このプロファイルを有効にする"),
      h("label", {class: "f"}, "プロファイル名", (() => { const i = textIn(() => p.name, v => { p.name = v; renderProfiles(); }, {style: "width:200px"}); return i; })()),
      h("label", {class: "f"}, "対象アプリ（exe名またはウィンドウタイトルの一部。空欄ならどこでも有効）",
        h("span", {class: "row"}, textIn(() => p.match, v => p.match = v, {placeholder: "例: client.exe", style: "width:240px"}), pick)),
      h("label", {class: "f"}, "キーの送り方（効かないときに変える）",
        selIn(() => p.sendMode || "keys", v => p.sendMode = v, [["keys", "キー入力（標準）"], ["post", "ウィンドウへ直接送る"], ["unicode", "Unicode文字入力"]])),
      h("span", {class: "sp"}),
      h("button", {class: "btn ghost danger", onclick: () => {
        if (confirm("プロファイル「" + (p.name || "") + "」を削除しますか？")) {
          cfg.profiles.splice(cfg.profiles.indexOf(p), 1); sel = cfg.profiles[0] ? cfg.profiles[0].id : null; changed(); render(); } }}, "プロファイル削除")),
    h("div", {class: "row", style: "margin-top:12px"},
      h("label", {class: "f", style: "flex:1"}, "ログファイル（任意）— ゲームが書き出すログやジャーナルのフルパス。新しい行を監視して、ログ起動・ログ待ちに使います",
        textIn(() => p.logPath, v => { p.logPath = v; }, {placeholder: "例: C:\\Users\\名前\\Documents\\uo_journal.txt"}))),
    h("div", {class: "logstat", id: "logstat"}),
    ...p.macros.map(m => macroCard(p, m)),
    h("button", {class: "btn primary", style: "margin-top:16px", onclick: () => {
      p.macros.push({id: uid(), name: "新しいマクロ", trigger: "", mode: "once", enabled: true, steps: []}); changed(); render(); }}, "＋ マクロ追加"));
}

// ----- status -----
function paintStatus() {
  const pill = document.getElementById("pill");
  pill.textContent = st.paused ? "一時停止中" : "動作中";
  pill.className = "pill " + (st.paused ? "off" : "on");
  document.getElementById("pauseBtn").textContent = st.paused ? "再開" : "一時停止";
  document.getElementById("fg").textContent = st.exe ? "前面: " + st.exe + (st.title ? " — " + st.title : "") : "";
  renderProfiles();
  const ls = document.getElementById("logstat"), cp = cfg.profiles.find(x => x.id === sel);
  if (ls) {
    const key = cp && cp.logPath ? cp.logPath.trim().toLowerCase() : "", s = key && st.logs[key];
    ls.className = "logstat" + (s ? (s.found ? " ok" : " ng") : "");
    ls.replaceChildren(...(!key ? [] : !cp.enabled ? ["プロファイルが無効のため監視していません"] : !s ? ["確認中…"] :
      s.found ? [h("b", {}, "監視中"), s.last ? "　最新の行: " + s.last : "　（まだ新しい行はありません）"] : [h("b", {}, "ファイルが見つかりません")]));
  }
  document.querySelectorAll(".card[data-id]").forEach(c => c.classList.toggle("running", isLive(c.dataset.id)));
  const d = st.diag, ago = ms => ms < 1500 ? "たった今" : Math.round(ms / 1000) + "秒前";
  const names = {}; for (const p of cfg.profiles) for (const m of p.macros) names[m.id] = m.name;
  const lastFired = Object.entries(d.fired || {}).sort((a, b) => a[1] - b[1])[0];
  document.getElementById("diag").replaceChildren("診断　最後に検知したキー: ",
    d.key ? h("b", {}, d.key) : "なし",
    d.key ? h("span", {class: d.keyHit ? "ok" : ""}, d.keyHit ? "（マクロに一致）" : "（一致するマクロなし）") : "",
    d.key ? " " + ago(d.keyAgo) : "",
    "　｜　最後に起動したマクロ: ", lastFired ? h("b", {}, names[lastFired[0]] || "(削除済み)") : "なし", lastFired ? " " + ago(lastFired[1]) : "",
    "　｜　キー送信: 成功 " + (d.sendOK || 0) + " / ", h("span", {class: d.sendFail ? "ng" : ""}, "失敗 " + (d.sendFail || 0)));
}
async function poll() {
  try {
    const s = await api("GET", "/api/state");
    st = {active: s.active || [], running: s.running || [], paused: s.paused, exe: s.exe, title: s.title, logs: s.logs || {}, diag: s.diag || {}};
    paintStatus();
  } catch (e) {
    document.getElementById("pill").textContent = "未接続"; document.getElementById("pill").className = "pill off";
  }
}
document.getElementById("pauseBtn").addEventListener("click", async () => { await api("POST", "/api/pause", {paused: !st.paused}); poll(); });
document.getElementById("quitBtn").addEventListener("click", async () => {
  if (!confirm("MacroLoom を終了しますか？（マクロは動かなくなります）")) return;
  await api("POST", "/api/quit"); document.body.replaceChildren(h("div", {class: "empty-state"}, "終了しました。このタブは閉じてかまいません。"));
});
document.getElementById("addProf").addEventListener("click", () => {
  const p = {id: uid(), name: "新しいプロファイル", match: "", enabled: true, macros: []};
  cfg.profiles.push(p); sel = p.id; changed(); render();
});

(async () => {
  const s = await api("GET", "/api/state");
  cfg = s.config; cfg.profiles = cfg.profiles || [];
  for (const p of cfg.profiles) { p.macros = p.macros || []; for (const m of p.macros) m.steps = m.steps || []; }
  sel = cfg.profiles[0] ? cfg.profiles[0].id : null;
  document.getElementById("pauseKey").replaceWith(Object.assign(keyBtn(() => cfg.pauseKey, v => cfg.pauseKey = v, true, "なし"), {id: "pauseKey"}));
  document.getElementById("ver").textContent = s.version ? "v" + s.version : "";
  render(); poll(); setInterval(poll, 500);
})();
</script>
</body>
</html>
