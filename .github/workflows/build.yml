name: build
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet -unsafeptr=false ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags "-H windowsgui -s -w" -o MacroLoom.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: MacroLoom
          path: MacroLoom.exe
